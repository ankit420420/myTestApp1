name: Node.js CI/CD - Elastic Beanstalk

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1

  # Replace these with the EXACT names shown in Elastic Beanstalk
  EB_APPLICATION_NAME: myapptest1
  EB_ENVIRONMENT_NAME: Myapptest1-env

jobs:
  # =========================
  # CI
  # =========================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # =========================
  # CD
  # =========================
  deploy:
    name: Deploy to Elastic Beanstalk

    needs: test

    # Deploy only after a push to main.
    # Pull requests will run CI but will NOT deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create deployment package
        run: |
          git archive \
            --format=zip \
            --output=application.zip \
            HEAD

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload application to S3
        run: |
          aws s3 cp \
            application.zip \
            s3://${{ secrets.EB_S3_BUCKET }}/application-${{ github.sha }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-label "${{ github.sha }}" \
            --source-bundle \
            S3Bucket=${{ secrets.EB_S3_BUCKET }},S3Key=application-${{ github.sha }}.zip

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENVIRONMENT_NAME }}" \
            --version-label "${{ github.sha }}"

      - name: Wait for environment deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ env.EB_ENVIRONMENT_NAME }}"
